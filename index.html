<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SM삼환기업 안전 영상</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#E8E7E2; --surface:#FFFFFF; --ink:#1A1A18; --muted:#55544F;
  --brand:#FF3E00; --brand-ink:#B32C00; --tape:#FFC71A; --band:#1A1A18; --chip:#D9D7D0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --ground:#1B1B19; --surface:#262624; --ink:#F2F1EE; --muted:#B5B3AC;
         --brand:#FF5A24; --brand-ink:#FF8A5E; --band:#0E0E0D; --chip:#3A3935; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--band);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 16px,#1A1A18 16px 32px)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.bar strong{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:22px;letter-spacing:-.01em}
.bar span{font-size:13px;opacity:.85}
.months{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;background:var(--band);scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.months button{flex-shrink:0;min-height:40px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:700}
.months button[aria-pressed="true"]{background:var(--brand)}
.months button.zero{opacity:.5}
#years{padding-bottom:0}
main{max-width:720px;margin:0 auto;padding:8px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.display{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;margin:0;line-height:1.2}
.group{scroll-margin-top:130px}
.group h2{font-size:22px;margin:24px 0 12px;display:flex;align-items:baseline;gap:8px}
.group h2 small{font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;list-style:none;margin:0;padding:0}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.poster{width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#000;position:relative;display:block}
.poster img{width:100%;height:100%;object-fit:contain;display:block}
.poster .ic{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
.tile b{font-size:16px;line-height:1.35;display:block}
.new{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;vertical-align:2px}
.empty{background:var(--surface);border-radius:14px;padding:32px 18px;text-align:center;color:var(--muted);margin-top:18px}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:13px}
.sheet{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
.sheet header{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff}
.sheet header .t{flex:1;min-width:0}
.sheet header b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet header small{opacity:.75;font-size:13px}
.round{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;flex-shrink:0}
.round:disabled{opacity:.3;cursor:default}
.stage{flex:1;min-height:0;padding:0 8px;display:flex}
.stage iframe{border:0;width:100%;height:100%;background:#111;border-radius:10px}
.nav{display:flex;justify-content:center;gap:20px;padding:12px}
.nav .round{width:auto;border-radius:999px;padding:0 20px;font-weight:700;font-size:15px;display:inline-flex;align-items:center}
.hint{color:#bbb;font-size:12px;text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<div class="top">
  <div class="tape" aria-hidden="true"></div>
  <div class="bar"><strong>안전 영상</strong><span>SM삼환기업 안전보건팀</span></div>
  <nav class="months" id="years" aria-label="연도 선택" hidden></nav>
  <nav class="months" id="months" aria-label="월별 보기"></nav>
</div>
<main id="app"></main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">
  <header>
    <div class="t"><b id="s-title"></b><small id="s-month"></small></div>
    <button class="round" id="close" type="button" aria-label="닫기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="stage"><iframe id="frame" title="안전 영상" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
  <p class="hint">재생 버튼을 누르세요. 안 나오면 <a id="ext" href="#" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline">구글 드라이브에서 열기</a></p>
  <div class="nav">
    <button class="round" id="prev" type="button">이전 영상</button>
    <button class="round" id="next" type="button">다음 영상</button>
  </div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyWVywdyFgheIR5Qe-g9UosyjVRb48FSTohR0nu3wb5vBbomdfPxAAMWLAjp6DISioN/exec?format=json';
var VIDEOS = [];
var app = document.getElementById('app');
var monthsNav = document.getElementById('months');
var yearsNav = document.getElementById('years');
var sheet = document.getElementById('sheet');
var frame = document.getElementById('frame');
var cur = -1;

function thumb(id){ return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w480'; }
function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
function poster(v){
  var p = el('span', 'poster');
  var img = new Image(); img.alt = ''; img.loading = 'lazy'; img.src = thumb(v.id);
  img.onerror = function(){ img.remove(); };
  var ic = el('span', 'ic');
  ic.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  p.appendChild(img); p.appendChild(ic);
  return p;
}

var FILTER = 'all';
var YEAR = null;
function ym(v){ var m = (v.month || '').match(/(\d{4})\D+(\d{1,2})/); return m ? { y: +m[1], m: +m[2] } : null; }
function chipBtn(label, pressed, onClick, dim){
  var c = el('button', dim ? 'zero' : null, label); c.type = 'button';
  c.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  c.onclick = onClick;
  return c;
}
function section(title, idxs, isNewest){
  var sec = el('section', 'group');
  var h = el('h2', 'display', title);
  h.appendChild(el('small', null, idxs.length + '편'));
  sec.appendChild(h);
  var ul = el('ul', 'grid');
  idxs.forEach(function(i){
    var v = VIDEOS[i];
    var li = el('li');
    var b = el('button', 'tile'); b.type = 'button';
    b.setAttribute('aria-label', v.title + ' 재생');
    b.appendChild(poster(v));
    var t = el('b', null, v.title);
    if (isNewest && i === 0) t.appendChild(el('span', 'new', '최신'));
    b.appendChild(t);
    b.onclick = function(){ open(i); };
    li.appendChild(b); ul.appendChild(li);
  });
  sec.appendChild(ul);
  return sec;
}
function render(){
  app.textContent = '';
  monthsNav.textContent = '';
  yearsNav.textContent = '';
  var years = [];
  VIDEOS.forEach(function(v){ var p = ym(v); if (p && years.indexOf(p.y) < 0) years.push(p.y); });
  years.sort(function(a, b){ return b - a; });
  if (YEAR === null) YEAR = years.length ? years[0] : new Date().getFullYear();
  yearsNav.hidden = years.length < 2;
  years.forEach(function(y){
    yearsNav.appendChild(chipBtn(y + '년', y === YEAR, function(){ YEAR = y; FILTER = 'all'; render(); window.scrollTo(0, 0); }));
  });
  var byMonth = {}; var etc = [];
  VIDEOS.forEach(function(v, i){
    var p = ym(v);
    if (!p) { etc.push(i); return; }
    if (p.y !== YEAR) return;
    (byMonth[p.m] = byMonth[p.m] || []).push(i);
  });
  var total = 0; for (var k in byMonth) total += byMonth[k].length;
  monthsNav.appendChild(chipBtn('전체 ' + total, FILTER === 'all', function(){ FILTER = 'all'; render(); window.scrollTo(0, 0); }));
  for (var m = 1; m <= 12; m++) (function(m){
    var n = (byMonth[m] || []).length;
    monthsNav.appendChild(chipBtn(m + '월' + (n ? ' ' + n : ''), FILTER === m, function(){ FILTER = m; render(); window.scrollTo(0, 0); }, !n));
  })(m);
  var sel = monthsNav.querySelector('[aria-pressed="true"]');
  if (sel) monthsNav.scrollLeft = Math.max(0, sel.offsetLeft - 16);

  if (FILTER === 'all'){
    var any = false;
    for (var mm = 12; mm >= 1; mm--) if (byMonth[mm]) { app.appendChild(section(YEAR + '년 ' + mm + '월', byMonth[mm], true)); any = true; }
    if (etc.length) { app.appendChild(section('기타 영상', etc, false)); any = true; }
    if (!any){ var e = el('div', 'empty'); e.appendChild(el('p', null, '아직 올라온 영상이 없습니다.')); app.appendChild(e); }
  } else {
    if (byMonth[FILTER]) app.appendChild(section(YEAR + '년 ' + FILTER + '월', byMonth[FILTER], true));
    else { var e2 = el('div', 'empty'); e2.appendChild(el('p', null, FILTER + '월 영상은 아직 없습니다.')); app.appendChild(e2); }
  }
  app.appendChild(el('footer', null, '위의 월을 누르면 그 달 영상만 볼 수 있어요'));
}

var IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function driveView(id){ return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view'; }
function open(i){
  cur = i;
  var v = VIDEOS[i];
  frame.src = 'https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/preview';
  document.getElementById('ext').href = driveView(v.id);
  document.getElementById('s-title').textContent = v.title;
  document.getElementById('s-month').textContent = v.month || '';
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = i >= VIDEOS.length - 1;
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('close').focus();
}
function close(){
  sheet.classList.remove('open');
  frame.src = 'about:blank';
  document.body.style.overflow = '';
}
document.getElementById('close').onclick = close;
document.getElementById('prev').onclick = function(){ if (cur > 0) open(cur - 1); };
document.getElementById('next').onclick = function(){ if (cur < VIDEOS.length - 1) open(cur + 1); };
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && sheet.classList.contains('open')) close(); });

var loading = el('div', 'empty'); loading.appendChild(el('p', null, '영상 목록을 불러오는 중…')); app.appendChild(loading);
fetch(API + '&t=' + Date.now(), { credentials: 'omit' })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){ VIDEOS = (d && d.videos) || []; render(); })
  .catch(function(){
    app.textContent = '';
    var e = el('div', 'empty');
    e.appendChild(el('p', null, '영상 목록을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'));
    app.appendChild(e);
  });
</script>
</body>
</html>
